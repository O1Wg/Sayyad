<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { width: 360px; font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; color: #1C2033; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #url { word-break: break-all; color: #4A4F66; font-size: 12px; }
  #score { font-size: 32px; font-weight: 700; margin: 6px 0 0; }
  .good { color: #1B998B; } .bad { color: #C8102E; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 12px; }
  button { margin-top: 6px; padding: 6px 12px; }
  #stats { margin-top: 12px; font-size: 12px; color: #4A4F66; }
</style></head>
<body>
  <h1>Sayyad</h1>
  <div id="url"></div>
  <div id="score"></div>
  <div id="verdict"></div>
  <ul id="reasons"></ul>
  <textarea id="paste" rows="2" placeholder="Paste any link to check it"></textarea>
  <button id="check">Check</button>
  <div id="stats"></div>
  <script src="features.js"></script>
  <script src="model.js"></script>
  <script src="brands.js"></script>
  <script src="explain.js"></script>
  <script src="popup.js"></script>
</body></html>
